name: Verify live Togetter page
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/live/**'
      - '.github/workflows/verify-live.yml'
permissions:
  contents: read
jobs:
  live-page:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test updating against current ranking without publishing
        run: node script/updateFrozenUsers.js
      - run: npx playwright install --with-deps chromium
      - run: npm run test:live
